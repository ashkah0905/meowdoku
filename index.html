<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meow Logic</title>
  <link rel="stylesheet" href="./styles.css?v=4">
</head>
<body>
  <main id="homeScreen" class="app home-screen">
    <h1 class="home-title">Meow Logic</h1>
    <section class="home-current" aria-label="現在の問題">
      <p>現在の問題</p>
      <strong id="homeLevelTitle">レベル 1</strong>
      <span id="homeDifficultyBadge" class="difficulty-badge" hidden></span>
    </section>
    <button id="continueBtn" class="primary-action home-continue" type="button">つづける</button>
    <p id="homeClearCount">クリア 0問</p>
  </main>

  <main id="gameScreen" class="app" hidden>
    <header class="topbar">
      <button id="homeBtn" class="icon-button" type="button" aria-label="ホームへ戻る">⌂</button>
      <div class="title-block">
        <p class="eyebrow">Meow Logic</p>
        <h1 id="levelTitle">レベル 1</h1>
        <span id="difficultyBadge" class="difficulty-badge" hidden></span>
      </div>
      <span class="topbar-spacer" aria-hidden="true"></span>
    </header>

    <section class="score-row" aria-label="進行状況">
      <div class="pill"><span aria-hidden="true">🐱</span> <strong id="catCount">0/5</strong></div>
      <div id="lifeHearts" class="pill hearts" aria-label="ライフ"></div>
      <div class="pill progress-pill" aria-label="クリア進捗">
        <span>クリア</span>
        <strong id="clearCount">0/6</strong>
      </div>
    </section>

    <section class="rules" aria-label="ルール">
      <p class="rule">1色につきネコ1匹</p>
      <p class="rule">各列・各行にネコ1匹</p>
      <p class="rule">ネコ同士は隣接不可</p>
    </section>

    <section class="settings" aria-label="設定">
      <label class="setting">
        <input id="autoCrossToggle" type="checkbox">
        ネコ発見時に×を自動入力
      </label>
    </section>

    <section class="board-wrap" aria-label="パズル盤面">
      <div id="board" class="board" aria-label="盤面"></div>
    </section>

    <section class="controls" aria-label="操作">
      <p id="statusText" class="visually-hidden" aria-live="polite"></p>
      <button id="hintBtn" class="primary-action" type="button">ヒント</button>
      <button id="memoBtn" type="button" aria-pressed="false">メモ</button>
      <button id="autoSolveBtn" class="finish-action" type="button" hidden>仕上げる</button>
      <button id="resetBtn" type="button">リセット</button>
      <button id="nextLevelBtn" class="primary-action" type="button" hidden>次の問題</button>
      <button id="resetMemoBtn" class="memo-reset" type="button" hidden>メモをリセット</button>
    </section>
    <p id="toast" class="toast" aria-hidden="true" hidden></p>
    <p id="saveWarning" role="status" hidden>保存できませんでした。このまま遊べますが、再読み込みすると今回の進行状況が失われる可能性があります。</p>
  </main>

  <div id="resultDialog" class="dialog" aria-hidden="true">
    <div class="dialog-backdrop"></div>
    <section class="dialog-card" role="dialog" aria-modal="true" aria-labelledby="resultTitle" aria-describedby="resultText">
      <p id="resultCat" class="result-cat" aria-hidden="true">=^._.^=</p>
      <h2 id="resultTitle">クリア</h2>
      <p id="resultText">すべてのネコを見つけました。</p>
      <button id="closeDialogBtn" type="button">つづける</button>
    </section>
  </div>

  <script src="./rules.js"></script>
  <script src="./levels.js"></script>
  <script src="./solver.js"></script>
  <script src="./level-analyzer.js"></script>
  <script src="./level-generator.js?v=2"></script>
  <script src="./progression.js?v=2"></script>
  <script src="./generated-level-store.js?v=2"></script>
  <script src="./game-state.js"></script>
  <script src="./main.js?v=6"></script>
</body>
</html>
