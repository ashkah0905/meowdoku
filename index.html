<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meowdoku</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button id="prevLevelBtn" class="icon-button" type="button" aria-label="前のレベル">←</button>
      <div class="title-block">
        <p class="eyebrow">Meow Logic</p>
        <h1 id="levelTitle">レベル 1</h1>
      </div>
      <button id="nextLevelBtn" class="icon-button" type="button" aria-label="次のレベル">→</button>
    </header>

    <section class="score-row" aria-label="進行状況">
      <div class="pill"><span aria-hidden="true">🐱</span> <strong id="catCount">0/5</strong></div>
      <div id="lifeHearts" class="pill hearts" aria-label="ライフ"></div>
      <div class="pill progress-pill" aria-label="クリア進捗">
        <span>クリア</span>
        <strong id="clearCount">0/3</strong>
      </div>
    </section>

    <section class="rules" aria-label="ルール">
      <p class="rule">1色につきネコ1匹</p>
      <p class="rule">各列・各行にネコ1匹</p>
      <p class="rule">ネコ同士は隣接不可</p>
    </section>

    <section class="settings" aria-label="設定">
      <label class="setting">
        <input id="autoCrossToggle" type="checkbox">
        ネコ発見時に×を自動入力
      </label>
    </section>

    <section class="board-wrap" aria-label="パズル盤面">
      <div id="board" class="board" aria-label="5行5列の盤面"></div>
    </section>

    <section class="controls" aria-label="操作">
      <p id="statusText" class="status" aria-live="polite">マスをタップして、ネコを探しましょう。</p>
      <button id="hintBtn" class="primary-action" type="button">ヒント</button>
      <button id="autoSolveBtn" class="finish-action" type="button" hidden>仕上げる</button>
      <button id="resetBtn" type="button">リセット</button>
    </section>
  </main>

  <div id="resultDialog" class="dialog" aria-hidden="true">
    <div class="dialog-backdrop"></div>
    <section class="dialog-card" role="dialog" aria-modal="true" aria-labelledby="resultTitle" aria-describedby="resultText">
      <p id="resultCat" class="result-cat" aria-hidden="true">=^._.^=</p>
      <h2 id="resultTitle">クリア</h2>
      <p id="resultText">すべてのネコを見つけました。</p>
      <button id="closeDialogBtn" type="button">つづける</button>
    </section>
  </div>

  <script src="./rules.js"></script>
  <script src="./levels.js"></script>
  <script src="./solver.js"></script>
  <script src="./game-state.js"></script>
  <script src="./main.js"></script>
</body>
</html>
